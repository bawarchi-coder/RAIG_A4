# Streamlit settings for the demo app (app.py).
# Local runs are restricted to this computer by start_demo.bat (--server.address 127.0.0.1);
# that setting is not here so that the same app can also run on Streamlit Community Cloud.
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"     # hide the Deploy button

[theme]
base = "light"             # reads better on most projectors
primaryColor = "#2563eb"
